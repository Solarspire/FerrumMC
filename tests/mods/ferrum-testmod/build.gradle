plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.148'
}

version = '1.0.0'
group = 'net.solarspire.ferrum.testmod'
base { archivesName = 'ferrum-testmod' }
java.toolchain.languageVersion = JavaLanguageVersion.of(25)
def java25 = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(25) }

// ModDevGradle's asset helper otherwise requests a separate Java 21 installation.
tasks.withType(net.neoforged.nfrtgradle.NeoFormRuntimeTask).configureEach {
    javaExecutable = java25.map { it.executablePath.asFile.absolutePath }
}

neoForge {
    version = '26.2.0.93'
    runs {
        client { client() }
        server {
            server()
            programArgument '--nogui'
            gameDirectory = file('run/server')
        }
        gameTestServer {
            type = 'gameTestServer'
            gameDirectory = file('run/gametest')
        }
    }
    mods {
        ferrum_testmod { sourceSet sourceSets.main }
    }
}

tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
tasks.named('jar') { from('LICENSE') }
