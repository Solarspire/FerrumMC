syntax = "proto3";
package patchbukkit.events;

import "patchbukkit/common/types.proto";

option java_multiple_files = true;
option java_package = "patchbukkit.events";

message VehicleBlockCollisionEvent {
  int32 vehicle_id = 1;
  int32 block_x = 2;
  int32 block_y = 3;
  int32 block_z = 4;
}

message VehicleCollisionEvent {
  int32 vehicle_id = 1;
}

message VehicleCreateEvent {
  int32 vehicle_id = 1;
}

message VehicleDamageEvent {
  int32 vehicle_id = 1;
  float damage = 2;
}

message VehicleDestroyEvent {
  int32 vehicle_id = 1;
}

message VehicleEnterEvent {
  int32 vehicle_id = 1;
  int32 entered_id = 2;
}

message VehicleEntityCollisionEvent {
  int32 vehicle_id = 1;
  int32 collided_entity_id = 2;
}

message VehicleExitEvent {
  int32 vehicle_id = 1;
  int32 exited_id = 2;
}

message VehicleMoveEvent {
  int32 vehicle_id = 1;
  double from_x = 2;
  double from_y = 3;
  double from_z = 4;
  double to_x = 5;
  double to_y = 6;
  double to_z = 7;
}

message VehicleUpdateEvent {
  int32 vehicle_id = 1;
}
