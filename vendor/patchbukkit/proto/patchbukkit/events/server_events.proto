syntax = "proto3";
package patchbukkit.events;

import "patchbukkit/common/types.proto";

option java_multiple_files = true;
option java_package = "patchbukkit.events";

message ServerListPingEvent {
  string motd = 1;
  uint32 max_players = 2;
  uint32 num_players = 3;
  string favicon = 4;
}

message MapInitializeEvent {
  int32 map_id = 1;
}

message PacketReceivedEvent {
  patchbukkit.common.UUID player_uuid = 1;
  int32 packet_id = 2;
  bytes payload = 3;
}

message PacketSentEvent {
  patchbukkit.common.UUID player_uuid = 1;
  int32 packet_id = 2;
  bytes payload = 3;
}

message PluginDisableEvent {
  string plugin_name = 1;
}

message PluginEnableEvent {
  string plugin_name = 1;
}

message RemoteServerCommandEvent {
  string command = 1;
}

message ServerBroadcastEvent {
  string message = 1;
  string sender = 2;
}

message ServerCommandEvent {
  string command = 1;
}

message ServerLoadEvent {
  string load_type = 1;
}

message ServerTickEndEvent {
  int32 tick = 1;
  int64 duration_nanos = 2;
}

message ServerTickStartEvent {
  int32 tick = 1;
}

message ServiceRegisterEvent {
  string service_name = 1;
}

message ServiceUnregisterEvent {
  string service_name = 1;
}

message TabCompleteEvent {
  string buffer = 1;
  repeated string completions = 2;
}
